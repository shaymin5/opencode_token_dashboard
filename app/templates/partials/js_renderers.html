<script>
var DASHBOARD = window.DASHBOARD || {};
(function() {
  'use strict';

  var charts = DASHBOARD.charts;
  var baseOption = DASHBOARD.baseOption;
  var fmtNum = DASHBOARD.fmtNum;
  var fmtCost = DASHBOARD.fmtCost;
  var fmtAxis = DASHBOARD.fmtAxis;
  var showOverlay = DASHBOARD.showOverlay;
  var hideOverlays = DASHBOARD.hideOverlays;

  /* ─── DIMENSION HELPER ─── */
  DASHBOARD.dimValue = function(d, dim) {
    if (dim === 'total_tokens') {
      return (d.input||0)+(d.output||0)+(d.reasoning||0)+(d.cache_read||0)+(d.cache_write||0);
    }
    return d[dim] || 0;
  };

  /* ─── MODEL BREAKDOWN ─── */
  DASHBOARD.renderModelBreakdown = function(data) {
    if (!charts['model-chart']) return;
    if (!Array.isArray(data) || data.length === 0) {
      showOverlay(charts['model-chart'], 'error');
      return;
    }

    var dim = DASHBOARD.currentSortBy;
    data.sort(function(a, b) {
      return (DASHBOARD.dimValue(a, dim) || 0) - (DASHBOARD.dimValue(b, dim) || 0);
    });

    var names = data.map(function(d) { return (d.model || 'unknown') + '  [' + (d.provider || '?') + ']'; });

    var providerColorMap = {};
    var providerPalette = ['#58a6ff','#3fb950','#bc8cff','#db6d28','#39d2c0','#db61a2','#8b9496','#f0883e','#768390','#9198a1'];
    var paletteIdx = 0;

    function providerColor(provider) {
      if (!providerColorMap[provider]) {
        providerColorMap[provider] = providerPalette[paletteIdx % providerPalette.length];
        paletteIdx++;
      }
      return providerColorMap[provider];
    }

    var option = baseOption({
      grid: { left: 12, right: 24, top: 12, bottom: 12, containLabel: true },
      xAxis: {
        type: 'value',
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { lineStyle: { color: '#21262d' } },
        axisLabel: { color: '#8b949e', fontSize: 10, fontFamily: '-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif', formatter: fmtAxis }
      },
      yAxis: {
        type: 'category',
        data: names,
        inverse: true,
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: { color: '#e6edf3', fontSize: 10, fontFamily: '-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif', width: 170, overflow: 'truncate' }
      },
      series: [{
        type: 'bar',
        data: data.map(function(d, i) {
          return {
            value: DASHBOARD.dimValue(d, dim),
            itemStyle: { color: providerColor(d.provider || 'unknown'), borderRadius: [0, 3, 3, 0] },
            _raw: d
          };
        }),
        barMaxWidth: 24,
        label: {
          show: true,
          position: 'right',
          color: '#8b949e',
          fontSize: 10,
          formatter: function(p) { return dim === 'cost' ? fmtCost(p.value) : fmtNum(p.value); },
          fontFamily: '-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif'
        }
      }],
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        formatter: function(params) {
          var p = params[0];
          var d = p.data._raw;
          return [
            '<span style="font-weight:600;color:#1f2328">' + (d.model || 'unknown') + '</span>',
            '<span style="color:#656d76">' + (d.provider || '?') + '</span>',
            '',
            'Input:      ' + fmtNum(d.input || 0),
            'Output:     ' + fmtNum(d.output || 0),
            'Reasoning:  ' + fmtNum(d.reasoning || 0),
            'Cache Read: ' + fmtNum(d.cache_read || 0),
            'Cache Write:' + fmtNum(d.cache_write || 0),
            'Messages:   ' + fmtNum(d.message_count || 0),
            d.cost ? 'Cost:       ' + fmtCost(d.cost) : ''
          ].filter(Boolean).join('<br/>');
        }
      },
      legend: { show: false }
    });

    charts['model-chart'].setOption(option, true);
  };

  /* ─── PROJECT BREAKDOWN ─── */
  DASHBOARD.renderProjectBreakdown = function(data) {
    if (!charts['project-chart']) return;
    if (!Array.isArray(data) || data.length === 0) {
      showOverlay(charts['project-chart'], 'error');
      return;
    }

    var dim = DASHBOARD.currentSortBy;
    data.sort(function(a, b) {
      return (DASHBOARD.dimValue(a, dim) || 0) - (DASHBOARD.dimValue(b, dim) || 0);
    });

    var projectPalette = ['#58a6ff','#3fb950','#bc8cff','#db6d28','#39d2c0','#db61a2','#f0883e','#768390','#9198a1','#4c9aff'];

    var names = data.map(function(d) { return d.project || 'unknown'; });

    var option = baseOption({
      grid: { left: 12, right: 24, top: 12, bottom: 12, containLabel: true },
      xAxis: {
        type: 'value',
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { lineStyle: { color: '#21262d' } },
        axisLabel: { color: '#8b949e', fontSize: 10, fontFamily: '-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif', formatter: fmtAxis }
      },
      yAxis: {
        type: 'category',
        data: names,
        inverse: true,
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: { color: '#e6edf3', fontSize: 10, fontFamily: '-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif', width: 170, overflow: 'truncate' }
      },
      series: [{
        type: 'bar',
        data: data.map(function(d, i) {
          return {
            value: DASHBOARD.dimValue(d, dim),
            itemStyle: { color: projectPalette[i % projectPalette.length], borderRadius: [0, 3, 3, 0] },
            _raw: d
          };
        }),
        barMaxWidth: 24,
        label: {
          show: true,
          position: 'right',
          color: '#8b949e',
          fontSize: 10,
          formatter: function(p) { return dim === 'cost' ? fmtCost(p.value) : fmtNum(p.value); },
          fontFamily: '-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif'
        }
      }],
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        formatter: function(params) {
          var p = params[0];
          var d = p.data._raw;
          return [
            '<span style="font-weight:600;color:#1f2328">' + (d.project || 'unknown') + '</span>',
            '',
            'Input:      ' + fmtNum(d.input || 0),
            'Output:     ' + fmtNum(d.output || 0),
            'Reasoning:  ' + fmtNum(d.reasoning || 0),
            'Cache Read: ' + fmtNum(d.cache_read || 0),
            'Cache Write:' + fmtNum(d.cache_write || 0),
            'Sessions:   ' + fmtNum(d.session_count || 0),
            d.cost ? 'Cost:       ' + fmtCost(d.cost) : ''
          ].filter(Boolean).join('<br/>');
        }
      },
      legend: { show: false }
    });

    charts['project-chart'].setOption(option, true);
  };

  /* ─── CACHE EFFICIENCY ─── */
  DASHBOARD.renderCacheEfficiency = function(data) {
    var chart = charts['cache-chart'];
    if (!chart || !data || !data.length) return;

    var dates = data.map(function(d) { return d.date; });
    var option = baseOption({
      legend: { data: ['Cache Hit Ratio', 'Cache Read', 'Input'], top: 0, left: 0, textStyle: {color:'#8b949e', fontSize:11} },
      grid: { left: 12, right: 24, top: 40, bottom: 12, containLabel: true },
      xAxis: { type: 'category', data: dates, axisLine: {lineStyle:{color:'#30363d'}}, axisLabel: {color:'#8b949e', fontSize:10} },
      yAxis: [
        { type: 'value', name: 'Ratio', min: 0, max: 1, axisLine: {show:false}, splitLine: {lineStyle:{color:'#21262d'}}, axisLabel: {color:'#8b949e', fontSize:10, formatter: function(v) { return (v*100).toFixed(0) + '%'; }} },
        { type: 'value', name: 'Tokens', axisLine: {show:false}, splitLine: {show:false}, axisLabel: {color:'#8b949e', fontSize:10, formatter: fmtAxis} }
      ],
      tooltip: {
        trigger: 'axis',
        formatter: function(params) {
          var res = '<div style="font-weight:600;margin-bottom:4px;">' + params[0].axisValue + '</div>';
          params.forEach(function(p) {
            var val = p.seriesName === 'Cache Hit Ratio'
              ? (p.value * 100).toFixed(2) + '%'
              : fmtAxis(p.value);
            res += '<div style="display:flex;align-items:center;gap:6px;margin-top:3px;">'
              + '<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:' + p.color + ';"></span>'
              + '<span>' + p.seriesName + ': <strong>' + val + '</strong></span></div>';
          });
          return res;
        }
      },
      series: [
        { name: 'Cache Hit Ratio', type: 'line', data: data.map(function(d) { return d.cache_hit_ratio; }), smooth: true, symbol: 'none', lineStyle: {color:'#3fb950', width:2}, itemStyle: {color:'#3fb950'}, yAxisIndex: 0 },
        { name: 'Cache Read', type: 'line', data: data.map(function(d) { return d.cache_read; }), smooth: true, symbol: 'none', lineStyle: {color:'#58a6ff', width:1.5}, itemStyle: {color:'#58a6ff'}, yAxisIndex: 1 },
        { name: 'Input', type: 'line', data: data.map(function(d) { return d.input; }), smooth: true, symbol: 'none', lineStyle: {color:'#d2991d', width:1.5}, itemStyle: {color:'#d2991d'}, yAxisIndex: 1 }
      ]
    });
    chart.setOption(option, true);
  };

  /* ─── AGENT BREAKDOWN ─── */
  DASHBOARD.renderAgentBreakdown = function(data) {
    var chart = charts['agent-chart'];
    if (!chart || !data || !data.length) { showOverlay(chart, 'error'); return; }

    var dim = DASHBOARD.currentSortBy;
    data.sort(function(a,b) {
      return (DASHBOARD.dimValue(a, dim) || 0) - (DASHBOARD.dimValue(b, dim) || 0);
    });
    var agentPalette = ['#58a6ff','#3fb950','#bc8cff','#db6d28','#39d2c0','#db61a2','#f0883e','#768390','#9198a1','#4c9aff'];
    var option = baseOption({
      grid: { left: 12, right: 24, top: 12, bottom: 12, containLabel: true },
      xAxis: { type: 'value', axisLine: {show:false}, splitLine: {lineStyle:{color:'#21262d'}}, axisLabel: {color:'#8b949e', fontSize:10, formatter: fmtAxis} },
      yAxis: { type: 'category', data: data.map(function(d) { return d.agent; }), inverse: true, axisLine: {show:false}, axisLabel: {color:'#e6edf3', fontSize:10, width: 70, overflow: 'truncate'} },
      series: [{
        type: 'bar',
        data: data.map(function(d, i) {
          return {
            value: DASHBOARD.dimValue(d, dim),
            itemStyle: { color: agentPalette[i % agentPalette.length], borderRadius: [0, 3, 3, 0] },
            _raw: d
          };
        }),
        barMaxWidth: 18,
        label: { show: true, position: 'right', color: '#8b949e', fontSize: 10, formatter: function(p) { return dim === 'cost' ? fmtCost(p.value) : fmtNum(p.value); } }
      }],
      tooltip: {
        trigger: 'axis', axisPointer: { type: 'shadow' },
        formatter: function(params) {
          var d = params[0].data._raw;
          return [
            '<span style="font-weight:600;color:#1f2328">' + d.agent + '</span>',
            'Input:      ' + fmtNum(d.input || 0),
            'Output:     ' + fmtNum(d.output || 0),
            'Reasoning:  ' + fmtNum(d.reasoning || 0),
            'Cache Read: ' + fmtNum(d.cache_read || 0),
            'Messages:   ' + fmtNum(d.message_count || 0),
            d.cost != null ? 'Cost:       ' + fmtCost(d.cost) : ''
          ].filter(Boolean).join('<br/>');
        }
      },
      legend: { show: false }
    });
    chart.setOption(option, true);
  };

  /* ─── USAGE HEATMAP ─── */
  DASHBOARD.renderUsageHeatmap = function(data) {
    var chart = charts['heatmap-chart'];
    if (!chart || !data || !data.length) { showOverlay(chart, 'error'); return; }

    var dim = DASHBOARD.currentSortBy;
    var hours = Array.from({length: 24}, function(_, i) { return String(i).padStart(2, '0') + ':00'; });
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var maxVal = 0;
    var heatmapData = [];

    var lookup = {};
    data.forEach(function(r) { lookup[r.day_of_week + '-' + r.hour] = DASHBOARD.dimValue(r, dim); });

    for (var d = 0; d < 7; d++) {
      for (var h = 0; h < 24; h++) {
        var key = d + '-' + String(h).padStart(2, '0');
        var val = lookup[key] || 0;
        heatmapData.push([h, d, val]);
        if (val > maxVal) maxVal = val;
      }
    }

    var option = baseOption({
      grid: { left: 50, right: 100, top: 22, bottom: 26 },
      xAxis: { type: 'category', data: hours, splitArea: {show: true}, axisLine: {show:false}, axisLabel: {color:'#8b949e', fontSize:9, interval: 3, margin: 10} },
      yAxis: { type: 'category', data: days, splitArea: {show: true}, axisLine: {show:false}, axisLabel: {color:'#8b949e', fontSize:10} },
      visualMap: {
        min: 0, max: maxVal || 1,
        calculable: true,
        orient: 'vertical', right: 0, top: 'center',
        inRange: { color: ['#0d1117', '#1c2129', '#58a6ff', '#3fb950', '#d2991d', '#f85149'] }
      },
      series: [{
        type: 'heatmap',
        data: heatmapData,
        label: { show: false },
        emphasis: { itemStyle: { borderColor: '#e6edf3', borderWidth: 1 } }
      }],
      tooltip: {
        trigger: 'item',
        formatter: function(params) {
          var dimLabel = dim === 'cost' ? 'Cost' : 'Tokens';
          var val = dim === 'cost' ? fmtCost(params.value[2]) : fmtNum(params.value[2]);
          return days[params.value[1]] + ' ' + hours[params.value[0]] + '<br/>' + val + ' ' + dimLabel;
        }
      }
    });
    chart.setOption(option, true);
  };

  /* ─── TOP SESSIONS ─── */
  DASHBOARD.renderTopSessions = function(data) {
    var chart = charts['top-sessions-chart'];
    if (!chart || !data || !data.length) { showOverlay(chart, 'error'); return; }

    var dim = DASHBOARD.currentSortBy;
    data.sort(function(a,b) {
      return (DASHBOARD.dimValue(a, dim) || 0) - (DASHBOARD.dimValue(b, dim) || 0);
    });
    var titleMaxLen = 50;
    var names = data.map(function(d) {
      var t = d.title || 'Untitled';
      return t.length > titleMaxLen ? t.substring(0, titleMaxLen) + '...' : t;
    });

    var option = baseOption({
      grid: { left: 12, right: 24, top: 12, bottom: 12, containLabel: true },
      xAxis: { type: 'value', axisLine: {show:false}, splitLine: {lineStyle:{color:'#21262d'}}, axisLabel: {color:'#8b949e', fontSize:10, formatter: fmtAxis} },
      yAxis: { type: 'category', data: names, inverse: true, axisLine: {show:false}, axisLabel: {color:'#e6edf3', fontSize:10, width: 170, overflow: 'truncate'} },
      series: [{
        type: 'bar',
        data: data.map(function(d) {
          return {
            value: DASHBOARD.dimValue(d, dim),
            itemStyle: { color: '#58a6ff', borderRadius: [0, 3, 3, 0] },
            _raw: d
          };
        }),
        barMaxWidth: 18,
        label: { show: true, position: 'right', color: '#8b949e', fontSize: 10, formatter: function(p) { return dim === 'cost' ? fmtCost(p.value) : fmtNum(p.value); } }
      }],
      tooltip: {
        trigger: 'axis', axisPointer: { type: 'shadow' },
        formatter: function(params) {
          var d = params[0].data._raw;
          var dimLabel = dim === 'cost' ? 'Cost' : 'Value';
          var dimFmt = dim === 'cost' ? fmtCost(d.cost || 0) : fmtNum(DASHBOARD.dimValue(d, dim));
          return [
            '<span style="font-weight:600;color:#1f2328">' + (d.title || 'Untitled') + '</span>',
            '<span style="color:#656d76">' + (d.project || '?') + '</span>',
            dimLabel + ':     ' + dimFmt,
            'Total Tokens:' + fmtNum(d.total_tokens || 0),
            'Cost:       ' + fmtCost(d.cost || 0),
            'Messages:   ' + fmtNum(d.message_count || 0)
          ].join('<br/>');
        }
      },
      legend: { show: false }
    });
    chart.setOption(option, true);
  };
})();
</script>
