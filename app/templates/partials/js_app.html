<script>
var DASHBOARD = window.DASHBOARD || {};
(function() {
  'use strict';

  var el = DASHBOARD.el;
  var charts = DASHBOARD.charts;
  var apiFetch = DASHBOARD.apiFetch;
  var fmtNum = DASHBOARD.fmtNum;
  var fmtCost = DASHBOARD.fmtCost;
  var showOverlay = DASHBOARD.showOverlay;
  var hideOverlays = DASHBOARD.hideOverlays;
  var dateParams = DASHBOARD.dateParams;
  var toISODate = DASHBOARD.toISODate;
  var daysAgo = DASHBOARD.daysAgo;

  /* ─── GRANULARITY ─── */
  DASHBOARD.currentGranularity = 'day';

  /* ─── HELPERS ─── */

  function populateCards(all) {
    var ov = all.overview;
    el('card-tokens').querySelector('.card-value').textContent = fmtNum(ov.total_tokens);
    el('card-cost').querySelector('.card-value').textContent = fmtCost(ov.total_cost);
    el('card-sessions').querySelector('.card-value').textContent = fmtNum(ov.total_sessions);
    el('card-messages').querySelector('.card-value').textContent = fmtNum(ov.total_messages);

    var paid = ov.paid_messages || 0;
    el('card-cost-secondary').textContent = paid + ' paid ' + (paid === 1 ? 'message' : 'messages');

    var now = new Date();
    el('refresh-time').textContent = 'Last refresh: ' + now.toLocaleString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    });

    // Efficiency mini cards from model_efficiency
    var me = all.model_efficiency;
    if (me && me.length) {
      var totalCost = 0, totalTokens = 0, weightedCacheRate = 0, cacheWeight = 0;
      me.forEach(function(d) {
        totalCost += d.total_cost || 0;
        totalTokens += d.total_tokens || 0;
        if (d.cache_hit_ratio != null) {
          weightedCacheRate += (d.cache_hit_ratio || 0) * (d.total_tokens || 0);
          cacheWeight += d.total_tokens || 0;
        }
      });
      var avgCost = totalTokens > 0 ? (totalCost / totalTokens * 1000) : 0;
      el('card-cost-per-1k').querySelector('.card-value').textContent = fmtCost(avgCost);
      var cacheRate = cacheWeight > 0 ? (weightedCacheRate / cacheWeight) : 0;
      el('card-cache-rate').querySelector('.card-value').textContent = (cacheRate * 100).toFixed(1) + '%';
    }

    // Top agent card from agent_breakdown
    var ab = all.agent_breakdown;
    if (ab && ab.length > 0) {
      el('card-top-agent').querySelector('.card-value').textContent = ab[0].agent;
    }
  }

  function renderAllCharts(all) {
    var renderMap = [
      { key: 'usage_heatmap',    dom: 'heatmap-chart',     render: DASHBOARD.renderUsageHeatmap },
      { key: 'top_sessions',     dom: 'top-sessions-chart', render: DASHBOARD.renderTopSessions },
      { key: 'tokens_by_model',  dom: 'model-chart',       render: DASHBOARD.renderModelBreakdown },
      { key: 'tokens_by_project',dom: 'project-chart',     render: DASHBOARD.renderProjectBreakdown },
      { key: 'agent_breakdown',  dom: 'agent-chart',       render: DASHBOARD.renderAgentBreakdown },
      { key: 'cost_breakdown',   dom: 'cost-chart',        render: DASHBOARD.renderCostBreakdown },
      { key: 'cache_efficiency', dom: 'cache-chart',       render: DASHBOARD.renderCacheEfficiency },
    ];

    renderMap.forEach(function(p) {
      var chart = charts[p.dom];
      if (!chart) return;
      try {
        p.render(all[p.key] || []);
      } catch(e) {
        console.error(p.key + ' render error:', e);
        showOverlay(chart, 'error');
      }
    });
  }

  function showAllLoading() {
    var panelIds = [
      'heatmap-chart', 'top-sessions-chart', 'model-chart', 'project-chart',
      'agent-chart', 'cost-chart', 'cache-chart', 'mini-ts-chart'
    ];
    panelIds.forEach(function(id) {
      var chart = charts[id];
      if (chart) showOverlay(chart, 'loading');
    });
  }

  function hideAllLoading() {
    var panelIds = [
      'heatmap-chart', 'top-sessions-chart', 'model-chart', 'project-chart',
      'agent-chart', 'cost-chart', 'cache-chart', 'mini-ts-chart'
    ];
    panelIds.forEach(function(id) {
      var chart = charts[id];
      if (chart) hideOverlays(chart);
    });
  }

  function showAllError() {
    var panelIds = [
      'heatmap-chart', 'top-sessions-chart', 'model-chart', 'project-chart',
      'agent-chart', 'cost-chart', 'cache-chart', 'mini-ts-chart'
    ];
    panelIds.forEach(function(id) {
      var chart = charts[id];
      if (chart) showOverlay(chart, 'error');
    });
  }

  /* ─── LOAD ALL DATA (single consolidated fetch) ─── */
  DASHBOARD.loadAllData = function(granularity, dp) {
    dp = dp || dateParams();
    var params = Object.assign({view: 'all', granularity: granularity || 'day'}, dp || {});

    showAllLoading();
    apiFetch('/api/data', params)
      .then(function(all) {
        hideAllLoading();
        populateCards(all);
        if (all.tokens_by_date) {
          DASHBOARD.renderMiniTimeSeries(all.tokens_by_date);
        }
        renderAllCharts(all);
      })
      .catch(function(err) {
        console.error('Dashboard data fetch failed:', err);
        ['tokens','cost','sessions','messages'].forEach(function(k) {
          var card = el('card-' + k);
          if (card) card.querySelector('.card-value').textContent = 'Error';
        });
        showAllError();
      });
  };

  /* ─── GRANULARITY TOGGLE ─── */
  var toggleButtons = document.querySelectorAll('#granularity-toggle button');

  toggleButtons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var g = this.getAttribute('data-granularity');
      if (g === DASHBOARD.currentGranularity) return;

      toggleButtons.forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      DASHBOARD.currentGranularity = g;

      var dp = dateParams();
      var params = Object.assign({view: 'all', granularity: g}, dp || {});
      var miniChart = charts['mini-ts-chart'];
      if (miniChart) showOverlay(miniChart, 'loading');
      apiFetch('/api/data', params)
        .then(function(all) {
          if (miniChart) hideOverlays(miniChart);
          if (all.tokens_by_date) {
            DASHBOARD.renderMiniTimeSeries(all.tokens_by_date);
          }
        })
        .catch(function(err) {
          console.error(err);
          if (miniChart) showOverlay(miniChart, 'error');
        });
    });
  });

  /* ─── TIME RANGE PRESETS ─── */
  var rangeButtons = document.querySelectorAll('#range-presets button');

  rangeButtons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var range = this.getAttribute('data-range');
      if (this.classList.contains('active')) return;

      rangeButtons.forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');

      var today = new Date();
      if (range === '7d') {
        DASHBOARD.currentStartDate = toISODate(daysAgo(7));
        DASHBOARD.currentEndDate = toISODate(today);
      } else if (range === '30d') {
        DASHBOARD.currentStartDate = toISODate(daysAgo(30));
        DASHBOARD.currentEndDate = toISODate(today);
      } else if (range === '90d') {
        DASHBOARD.currentStartDate = toISODate(daysAgo(90));
        DASHBOARD.currentEndDate = toISODate(today);
      } else if (range === 'all') {
        DASHBOARD.currentStartDate = null;
        DASHBOARD.currentEndDate = null;
      }

      el('start-date').value = '';
      el('end-date').value = '';

      DASHBOARD.loadAllData(DASHBOARD.currentGranularity);
    });
  });

  /* ─── CUSTOM DATE INPUTS ─── */
  el('start-date').addEventListener('change', function() {
    DASHBOARD.currentStartDate = this.value || null;
    rangeButtons.forEach(function(b) { b.classList.remove('active'); });
    DASHBOARD.loadAllData(DASHBOARD.currentGranularity);
  });

  el('end-date').addEventListener('change', function() {
    DASHBOARD.currentEndDate = this.value || null;
    rangeButtons.forEach(function(b) { b.classList.remove('active'); });
    DASHBOARD.loadAllData(DASHBOARD.currentGranularity);
  });

  /* ─── RESPONSIVE ─── */
  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      DASHBOARD.allCharts.forEach(function(c) { c.resize(); });
    }, 120);
  });

  /* ─── BOOT ─── */
  document.addEventListener('DOMContentLoaded', function() {
    DASHBOARD.loadAllData('day');
  });

})();
</script>
