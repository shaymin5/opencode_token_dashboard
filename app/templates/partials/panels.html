<!-- ── PANEL GRID ── -->
<div class="panel-grid" id="panel-grid">

  <!-- Heatmap -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">Usage Heatmap (Asia/Shanghai)</h2>
    </div>
    <div class="chart-container half" id="heatmap-container">
      <div class="chart-overlay" id="heatmap-loading"><span class="message">Loading<span class="loading-dots"></span></span></div>
      <div class="chart-overlay hidden" id="heatmap-error"><span class="message error">Error loading data</span></div>
      <div class="chart-inner" id="heatmap-chart"></div>
    </div>
  </section>

  <!-- Top Sessions -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">Top Sessions</h2>
    </div>
    <div class="chart-container half" id="top-sessions-container">
      <div class="chart-overlay" id="top-sessions-loading"><span class="message">Loading<span class="loading-dots"></span></span></div>
      <div class="chart-overlay hidden" id="top-sessions-error"><span class="message error">Error loading data</span></div>
      <div class="chart-inner" id="top-sessions-chart"></div>
    </div>
  </section>

  <!-- By Model -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">By Model</h2>
    </div>
    <div class="chart-container half" id="model-container">
      <div class="chart-overlay" id="model-loading"><span class="message">Loading<span class="loading-dots"></span></span></div>
      <div class="chart-overlay hidden" id="model-error"><span class="message error">Error loading data</span></div>
      <div class="chart-inner" id="model-chart"></div>
    </div>
  </section>

  <!-- By Project -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">By Project</h2>
    </div>
    <div class="chart-container half" id="project-container">
      <div class="chart-overlay" id="project-loading"><span class="message">Loading<span class="loading-dots"></span></span></div>
      <div class="chart-overlay hidden" id="project-error"><span class="message error">Error loading data</span></div>
      <div class="chart-inner" id="project-chart"></div>
    </div>
  </section>

  <!-- By Agent -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">By Agent</h2>
    </div>
    <div class="chart-container half" id="agent-container">
      <div class="chart-overlay" id="agent-loading"><span class="message">Loading<span class="loading-dots"></span></span></div>
      <div class="chart-overlay hidden" id="agent-error"><span class="message error">Error loading data</span></div>
      <div class="chart-inner" id="agent-chart"></div>
    </div>
  </section>

  <!-- Cache Efficiency -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">Cache Efficiency</h2>
    </div>
    <div class="chart-container half" id="cache-container">
      <div class="chart-overlay" id="cache-loading"><span class="message">Loading<span class="loading-dots"></span></span></div>
      <div class="chart-overlay hidden" id="cache-error"><span class="message error">Error loading data</span></div>
      <div class="chart-inner" id="cache-chart"></div>
    </div>
  </section>

</div>
