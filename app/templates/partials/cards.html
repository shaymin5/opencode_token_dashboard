<!-- ── OVERVIEW CARDS ── -->
<section class="overview-grid" id="overview-cards">
  <div class="card" id="card-tokens">
    <div class="card-icon">Total Tokens</div>
    <div class="card-value">--</div>
    <div class="card-label">input + output + reasoning + cache</div>
  </div>
  <div class="card" id="card-cost">
    <div class="card-icon">Total Cost</div>
    <div class="card-value">--</div>
    <div class="card-secondary" id="card-cost-secondary"></div>
  </div>
  <div class="card" id="card-sessions">
    <div class="card-icon">Sessions</div>
    <div class="card-value">--</div>
    <div class="card-label">total sessions tracked</div>
  </div>
  <div class="card" id="card-messages">
    <div class="card-icon">Messages</div>
    <div class="card-value">--</div>
    <div class="card-label">total messages tracked</div>
  </div>
</section>

<!-- ── EFFICIENCY MINI CARDS ── -->
<section class="efficiency-grid" id="efficiency-cards">
  <div class="card" id="card-cost-per-1k">
    <div class="card-icon">Avg Cost / 1K Tokens</div>
    <div class="card-value">--</div>
    <div class="card-label">weighted by model usage</div>
  </div>
  <div class="card" id="card-cache-rate">
    <div class="card-icon">Cache Hit Rate</div>
    <div class="card-value">--</div>
    <div class="card-label">cache_read / (cache_read + input)</div>
  </div>
  <div class="card" id="card-top-agent">
    <div class="card-icon">Top Agent</div>
    <div class="card-value">--</div>
    <div class="card-label">by total tokens</div>
  </div>
</section>
